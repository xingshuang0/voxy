name: Java CI with Gradle

on:
  push:
    branches: [ "neoforge-1.21.1" ]
  pull_request:
    branches: [ "neoforge-1.21.1" ]
  workflow_dispatch:   

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Prepare local jars
      run: |
        mkdir -p libs/aero-spike
        wget -O libs/aero-spike/create-1.21.1-6.0.10.jar "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar"
        wget -O libs/aero-spike/Ponder-NeoForge-1.21.1-1.0.64.jar "你的链接2"
        wget -O libs/aero-spike/flywheel-neoforge-api-1.21.1-1.0.6.jar "你的链接3"

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: voxy-jar
        path: build/libs/*.jar

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
